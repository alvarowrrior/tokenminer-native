[package]
name = "tokenminer-native"
version = "0.9.1"
edition = "2021"
description = "Minero nativo de TokenMiner: mina con la GPU solo mientras resulta rentable con el precio real de la luz"
publish = false
license = "GPL-3.0-only"
autobins = false

[features]
bundle = []

[[bin]]
name = "tokenminer-helper"
path = "src/main.rs"

[[bin]]
name = "tokenminer-setup"
path = "src/bin/setup.rs"

[dependencies]
futures-util = "0.3"
hex = "0.4"
primitive-types = "0.13.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
wgpu = "27.0.1"
tokenminer-quantus = { git = "https://github.com/alvarowrrior/tokenminer-quantus", tag = "v0.1.1" }

[target.'cfg(windows)'.dependencies]
tokenminer-pearl = { git = "https://github.com/alvarowrrior/tokenminer-pearl", tag = "v0.2.0" }
tokio-native-tls = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
